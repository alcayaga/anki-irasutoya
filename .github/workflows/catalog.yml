name: Build Catalog

on:
  workflow_call:
    outputs:
      catalog-sha:
        description: "SHA256 checksum of the generated catalog database"
        value: ${{ jobs.build-catalog.outputs.catalog-sha }}
  workflow_dispatch:
  schedule:
    # Monthly freshness check on the 1st of every month at 03:00 UTC
    - cron: '0 3 1 * *'

permissions:
  contents: read

jobs:
  build-catalog:
    name: Build & Validate Catalog
    runs-on: ubuntu-latest
    outputs:
      catalog-sha: ${{ steps.checksum.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download latest release catalog for comparison
        id: prev_catalog
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern "catalog.sqlite" --dir /tmp/old_catalog || echo "No previous release catalog found"

      - name: Cache Blogger Feed Crawl
        uses: actions/cache@v4
        with:
          path: .catalog_cache
          key: catalog-feed-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            catalog-feed-cache-${{ runner.os }}-

      - name: Build and Validate Catalog
        run: |
          COMPARE_FLAG=""
          if [ -f "/tmp/old_catalog/catalog.sqlite" ]; then
            COMPARE_FLAG="--compare-with /tmp/old_catalog/catalog.sqlite"
          fi
          python scripts/build_catalog.py --out addon/data/catalog.sqlite $COMPARE_FLAG

      - name: Extract Checksum Output
        id: checksum
        run: |
          SHA=$(cat addon/data/catalog.sqlite.sha256 | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload Catalog Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-sqlite
          path: |
            addon/data/catalog.sqlite
            addon/data/catalog.sqlite.sha256
          retention-days: 30
