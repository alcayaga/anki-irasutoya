name: Release Add-on

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Hermetic Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Hermetic Unit Tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build-catalog:
    name: Build Metadata Catalog
    uses: ./.github/workflows/catalog.yml

  package-and-release:
    name: Package Add-on & Create GitHub Release
    needs: [lint-and-test, build-catalog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download Catalog Artifact
        uses: actions/download-artifact@v4
        with:
          name: catalog-sqlite
          path: addon/data

      - name: Verify catalog checksum
        env:
          EXPECTED_SHA: ${{ needs.build-catalog.outputs.catalog-sha }}
        run: |
          echo "${EXPECTED_SHA}  addon/data/catalog.sqlite" | sha256sum --check -

      - name: Package Add-on
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/package_addon.py --version "$VERSION" --catalog addon/data/catalog.sqlite --out dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG_NAME" \
            dist/*.ankiaddon \
            addon/data/catalog.sqlite \
            addon/data/catalog.sqlite.sha256 \
            --title "Release $TAG_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG
